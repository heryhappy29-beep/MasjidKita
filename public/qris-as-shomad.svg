      <text y="20" font-size="5.5" font-weight="700" fill="#ffffff" text-anchor="middle">Scan &amp; Cek</text>
    </g>

    <!-- Step 3: Bayar -->
    <g transform="translate(155, 20)">
      <circle r="12" fill="#ffffff"/>
      <rect x="-5" y="-7" width="10" height="14" rx="2" fill="none" stroke="#E11D2A" stroke-width="1.3"/>
