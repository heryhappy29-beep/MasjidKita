  <!-- SLOGAN ASPI: SATU QRIS UNTUK SEMUA -->
  <g transform="translate(300, 580)" text-anchor="middle" font-family="'Montserrat', Arial, sans-serif">
    <rect x="-140" y="-18" width="280" height="28" rx="6" fill="#F4F5F7"/>
    <text y="1" font-size="12" font-weight="800" fill="#222222" letter-spacing="0.5">SATU QRIS UNTUK SEMUA</text>
    <text y="24" font-size="10.5" font-weight="500" fill="#444444">Cek aplikasi penyelenggara di:</text>
    <text y="39" font-size="11" font-weight="700" fill="#111111">www.aspi-qris.id</text>
  </g>

  <!-- FOOTER BAR: CETAK & CARA BAYAR -->
  <!-- Kiri Bawah: Acquirer & Versi -->
  <g transform="translate(42, 715)" font-family="'Montserrat', Arial, sans-serif">
    <text y="0" font-size="9.5" font-weight="600" fill="#333333">Dicetak oleh : 93600009</text>
    <text y="15" font-size="9.5" font-weight="600" fill="#333333">Versi Cetak : 1.0-2025.02.10</text>
