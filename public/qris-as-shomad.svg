      <text y="26" font-size="5.5" font-weight="700" fill="#ffffff" text-anchor="middle">Berlogo QRIS</text>
    </g>

    <!-- Step 2: Scan & Cek -->
    <g transform="translate(80, 20)">
      <circle r="12" fill="#ffffff"/>
      <path d="M-6 -6 H-2 M2 -6 H6 M-6 6 H-2 M2 6 H6 M-6 -6 V-2 M-6 2 V6 M6 -6 V-2 M6 2 V6" stroke="#E11D2A" stroke-width="1.4" fill="none"/>
