    <g transform="translate(0, 0)">
      <path d="M0 0 H20 V6 H6 V20 H0 Z" fill="#000000"/>
      <path d="M35 0 H15 V6 H29 V20 H35 Z" fill="#000000" transform="translate(5,0)"/>
      <rect x="6" y="8" width="5" height="5" fill="#000000"/>
      <text x="44" y="19" font-size="23" font-weight="900" font-family="'Montserrat', Arial, sans-serif" letter-spacing="-0.5" fill="#000000">QRIS</text>
