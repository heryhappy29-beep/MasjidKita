<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760">
  <defs>
    <!-- Geometric ASPI Pattern in background -->
    <pattern id="qris-geom" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M16 0 L32 16 L16 32 L0 16 Z" fill="none" stroke="#edf0f4" stroke-width="1"/>
      <path d="M0 0 L8 8 M24 8 L32 0 M32 32 L24 24 M8 24 L0 32" stroke="#edf0f4" stroke-width="1"/>
      <rect x="11" y="11" width="10" height="10" fill="none" stroke="#edf0f4" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background Base with subtle Islamic lattice watermark -->
  <rect width="600" height="760" fill="#ffffff"/>
  <rect width="600" height="760" fill="url(#qris-geom)"/>

  <!-- Red Decorative Geometric Polygon on Left Edge (Sesuai Plakat Asli) -->
  <polygon points="0,180 115,290 0,400" fill="#E11D2A"/>

  <!-- Red Decorative Diagonal Triangle on Bottom Right Corner (Sesuai Plakat Asli) -->
  <polygon points="600,530 380,760 600,760" fill="#E11D2A"/>

  <!-- TOP HEADER -->
  <g transform="translate(42, 36)">
