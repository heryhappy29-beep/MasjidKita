  <!-- Kanan Bawah: Panduan Cara Bayar Segitiga Merah -->
  <g transform="translate(415, 685)" font-family="'Montserrat', Arial, sans-serif">
    <text x="80" y="-5" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">Cara bayar dengan QRIS:</text>
    
    <!-- Step 1: Buka Aplikasi Berlogo QRIS -->
    <g transform="translate(0, 20)">
      <circle r="12" fill="#ffffff"/>
      <rect x="-5" y="-7" width="10" height="14" rx="2" fill="none" stroke="#E11D2A" stroke-width="1.3"/>
