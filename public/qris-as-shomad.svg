      <text x="98" y="22" font-size="9" font-weight="800" font-family="'Montserrat', Arial, sans-serif" fill="#000000">Pembayaran Nasional</text>
    </g>

    <!-- GPN Logo (Gerbang Pembayaran Nasional) -->
    <g transform="translate(440, -4)">
      <path d="M25 0 C32 4, 38 12, 42 22 C34 16, 26 15, 18 16 C25 20, 28 26, 30 32 C20 25, 12 25, 2 27 C10 18, 18 10, 25 0 Z" fill="#E11D2A"/>
