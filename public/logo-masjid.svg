<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background transparent / circle -->
  <defs>
    <!-- Color Palette -->
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#058a5c" />
      <stop offset="100%" stop-color="#006b43" />
    </radialGradient>
    
    <!-- Path for text curve AS-SHOMAD -->
    <path id="textArc" d="M 75 255 A 135 135 0 0 1 325 255" fill="none" />
    <path id="subTextArc" d="M 95 295 A 120 120 0 0 0 305 295" fill="none" />
  </defs>

  <!-- Outer Ring 1 (External Border) -->
  <circle cx="200" cy="200" r="192" fill="none" stroke="#007a52" stroke-width="6" />
  
  <!-- Outer Ring 2 -->
  <circle cx="200" cy="200" r="182" fill="none" stroke="#007a52" stroke-width="4" />

  <!-- Main Green Disk -->
  <circle cx="200" cy="200" r="172" fill="url(#greenGlow)" />

  <!-- Inner Dotted Ring -->
  <circle cx="200" cy="200" r="156" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="1.5 8" stroke-linecap="round" />

  <!-- Concentric Inner Circle Line -->
  <circle cx="200" cy="200" r="144" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Central Mosque Silhouette Window (White Sky Circle Arch) -->
  <circle cx="200" cy="180" r="95" fill="#ffffff" />

  <!-- Mosque Silhouette (Deep Emerald Green) -->
  <g fill="#007a52">
    <!-- Center Dome Base & Body -->
    <path d="M 152 235 L 152 205 C 152 175, 172 160, 200 142 C 228 160, 248 175, 248 205 L 248 235 Z" />
    
    <!-- Dome Spire & Crescent Moon -->
    <rect x="198.5" y="125" width="3" height="18" fill="#007a52" />
    <!-- Crescent Moon (Hilal) -->
    <path d="M 197 122 A 8 8 0 1 1 204 135 A 6.5 6.5 0 1 0 197 122 Z" fill="#007a52" />

    <!-- Left Minaret -->
    <!-- Base & Shaft -->
    <rect x="126" y="148" width="16" height="88" rx="1" />
    <!-- Balcony Lower -->
    <rect x="122" y="188" width="24" height="6" rx="1.5" fill="#ffffff" />
    <rect x="124" y="187" width="20" height="4" rx="1" fill="#007a52" />
    <!-- Balcony Upper -->
    <rect x="123" y="152" width="22" height="5" rx="1.5" fill="#ffffff" />
    <rect x="125" y="151" width="18" height="3" rx="1" fill="#007a52" />
    <!-- Minaret Dome / Spire -->
    <path d="M 127 148 C 127 136, 134 125, 134 112 C 134 125, 141 136, 141 148 Z" />
    <circle cx="134" cy="110" r="2.5" fill="#007a52" />

    <!-- Right Minaret -->
    <!-- Base & Shaft -->
    <rect x="258" y="148" width="16" height="88" rx="1" />
    <!-- Balcony Lower -->
    <rect x="254" y="188" width="24" height="6" rx="1.5" fill="#ffffff" />
    <rect x="256" y="187" width="20" height="4" rx="1" fill="#007a52" />
    <!-- Balcony Upper -->
    <rect x="255" y="152" width="22" height="5" rx="1.5" fill="#ffffff" />
    <rect x="257" y="151" width="18" height="3" rx="1" fill="#007a52" />
    <!-- Minaret Dome / Spire -->
    <path d="M 259 148 C 259 136, 266 125, 266 112 C 266 125, 273 136, 273 148 Z" />
    <circle cx="266" cy="110" r="2.5" fill="#007a52" />
  </g>

  <!-- Green Masking Overlay Curve at Lower Center -->
  <path d="M 85 240 C 130 220, 270 220, 315 240 L 320 270 C 260 295, 140 295, 80 270 Z" fill="#007a52" />

  <!-- Text "AS-SHOMAD" curved along arch -->
  <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="3" text-anchor="middle">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      AS-SHOMAD
    </textPath>
  </text>

  <!-- Horizontal Ribbon / Badge for "GRIYA PRAJA" -->
  <g transform="translate(0, 280)">
    <!-- Decorative dots flanking GRIYA PRAJA -->
    <circle cx="112" cy="0" r="3.5" fill="#ffffff" />
    <circle cx="122" cy="0" r="2.5" fill="#ffffff" />
    
    <text x="200" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="4" text-anchor="middle">
      GRIYA PRAJA
    </text>
    
    <circle cx="278" cy="0" r="2.5" fill="#ffffff" />
    <circle cx="288" cy="0" r="3.5" fill="#ffffff" />
  </g>

  <!-- Concentric Arc lines at bottom -->
  <path d="M 98 312 C 145 338, 255 338, 302 312" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />
  <path d="M 116 328 C 155 348, 245 348, 284 328" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
